  color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(10,16,30,0.55); border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  position:sticky; top:0; z-index:10;
  box-shadow:0 1px 0 var(--glass-hi) inset;
}
header img{height:26px; filter:drop-shadow(0 0 8px rgba(79,163,227,0.55))}
.langsel select{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;
  backdrop-filter:blur(10px);
}
main{flex:1; display:flex; flex-direction:column; align-items:center; padding:26px 16px 50px; gap:22px}
.hero{text-align:center; max-width:560px}
.hero h1{font-size:26px; font-weight:700; letter-spacing:-0.02em; text-shadow:0 2px 18px rgba(0,0,0,0.5)}
.hero p{color:var(--muted); margin-top:8px; font-size:14px; text-shadow:0 1px 8px rgba(0,0,0,0.5)}
.dropzone{
  width:100%; max-width:640px; border:1.5px dashed var(--glass-border); border-radius:18px;
  padding:40px 20px; text-align:center; cursor:pointer; transition:.2s;
  background:linear-gradient(160deg, rgba(30,50,85,0.35), rgba(10,18,34,0.25));
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), 0 1px 0 var(--glass-hi) inset;
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent-glow); background:linear-gradient(160deg, rgba(31,95,196,0.28), rgba(10,18,34,0.3))}
.dropzone svg{width:38px;height:38px;stroke:var(--accent-glow); margin-bottom:10px; filter:drop-shadow(0 0 6px rgba(79,163,227,0.5))}
.dropzone .sub{color:var(--muted); font-size:12.5px; margin-top:6px}
#fileInput{display:none}
.workspace{width:100%; max-width:1400px; display:none; flex-direction:column; gap:18px}
.viewer{
  background:var(--panel); border:1px solid var(--glass-border); border-radius:16px; overflow:hidden;
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), 0 1px 0 var(--glass-hi) inset;
}
.zoomBar{
  display:flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(14,22,40,0.45);
  border-bottom:1px solid var(--glass-border); font-size:12.5px; color:var(--muted);
}
.zoomBar button{
  background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--glass-border); border-radius:6px;
  width:26px; height:26px; cursor:pointer; font-size:14px; line-height:1; backdrop-filter:blur(8px);
}
.zoomBar button:hover{border-color:var(--accent-glow)}
.zoomBar #zoomReset,.zoomBar #fullscreenBtn{width:auto; padding:0 10px; font-size:12px}
.canvasWrap{
  position:relative; height:80vh; overflow:hidden; cursor:grab;
  background:repeating-conic-gradient(rgba(8,14,28,0.6) 0% 25%, rgba(12,20,38,0.6) 0% 50%) 50%/16px 16px;
  display:flex; align-items:center; justify-content:center; touch-action:none;
}
.canvasWrap:fullscreen{height:100vh; background:#000}
.canvasWrap.panning{cursor:grabbing}
.stage{position:relative; user-select:none}
.stage img, .stage canvas{display:block; max-height:80vh; max-width:100%; pointer-events:none}
.canvasWrap:fullscreen .stage img, .canvasWrap:fullscreen .stage canvas{max-height:100vh}
.clipLayer{position:absolute; top:0; right:0; height:100%; overflow:hidden}
.clipLayer canvas{position:absolute; top:0; right:0; height:100%; width:auto; max-height:none; max-width:none}
.handle{
  position:absolute; top:0; bottom:0; width:0; cursor:ew-resize; z-index:5;
}
.handle .line{position:absolute; top:0; bottom:0; left:-1px; width:2px; background:#fff; box-shadow:0 0 8px rgba(0,0,0,.5)}
.handle .knob{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.85); color:#111;
  display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.5);
  backdrop-filter:blur(6px);
}
.tagRow{display:flex; justify-content:space-between; padding:10px 14px; font-size:12.5px; background:rgba(14,22,40,0.4); border-top:1px solid var(--glass-border)}
.tagRow .tag{color:var(--muted)}
.tagRow .tag b{color:var(--text); margin-left:4px}
.targetBox{
  background:var(--panel); border:1px solid var(--glass-border); border-radius:16px; padding:18px;
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), 0 1px 0 var(--glass-hi) inset;
}
.targetBox .ctrl{flex:1; min-width:130px}
.targetBox input[type=number]{
  width:100%; background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--glass-border);
  border-radius:8px; padding:8px;
}
.targetBox .row{display:flex; gap:8px}
.targetMsg{font-size:12px; color:var(--muted); margin-top:6px; width:100%}
.controls{
  background:var(--panel); border:1px solid var(--glass-border); border-radius:16px;
  padding:18px; display:flex; flex-wrap:wrap; gap:18px; align-items:center;
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), 0 1px 0 var(--glass-hi) inset;
}
.ctrl{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); flex:1; min-width:150px}
.ctrl select,.ctrl input[type=range]{width:100%}
select{
  background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--glass-border); border-radius:8px; padding:8px;
  backdrop-filter:blur(10px);
}
input[type=range]{accent-color:var(--accent-glow)}
.savings{
  font-size:13px; color:var(--text); background:rgba(31,95,196,0.35); border:1px solid var(--glass-border);
  border-radius:10px; padding:8px 14px; white-space:nowrap; backdrop-filter:blur(10px);
}
.savings b{color:#8fd19e}
.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:1px solid rgba(255,255,255,0.12);
  padding:11px 22px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
  box-shadow:0 4px 18px rgba(31,95,196,0.45), 0 1px 0 rgba(255,255,255,0.15) inset; transition:.15s;
}
.btn:hover{filter:brightness(1.15)}
.btn.secondary{background:rgba(255,255,255,0.06); box-shadow:none; border:1px solid var(--glass-border); backdrop-filter:blur(10px)}
.actions{display:flex; gap:10px; justify-content:flex-end}
footer{text-align:center; color:var(--muted); font-size:11.5px; padding:16px; opacity:.7; text-shadow:0 1px 6px rgba(0,0,0,0.6)}

#intro{position:fixed;inset:0;z-index:9999;background:#050b1a;display:flex;align-items:center;justify-content:center;
  animation:introOut .5s ease-in 3.5s forwards;cursor:pointer}
#intro svg{width:min(88vw,760px);height:auto;overflow:visible}
#intro .glow{filter:drop-shadow(0 0 14px rgba(79,163,227,.75))}
#intro .word{font:800 104px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:2px;
  fill:#eaf1fb;fill-opacity:0;stroke:#4fa3e3;stroke-width:1.6;stroke-dasharray:1400;stroke-dashoffset:1400;
  animation:draw 2s ease-out .2s forwards,fillIn .7s ease-out 1.7s forwards}
#intro .squeeze{transform-origin:380px 120px;animation:squeeze 1.1s cubic-bezier(.7,0,.2,1) 2s both}
#intro .bar{fill:#4fa3e3;transform-origin:380px 182px;transform:scaleX(0);animation:bar 1.2s cubic-bezier(.7,0,.2,1) 1.9s forwards}
#intro .by{font:500 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:8px;fill:#93aed0;opacity:0;
  animation:fadeUp .8s ease-out 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:1;stroke-opacity:.0}}
@keyframes squeeze{0%{transform:scaleX(1)}45%{transform:scaleX(.9)}100%{transform:scaleX(1)}}
@keyframes bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

:root{color-scheme:dark}
select,input,button{color-scheme:dark}
select option,select optgroup{background-color:#0e1628;color:#eaf1fb}
select option:checked,select option:hover{background-color:#1f4f8f;color:#fff}
input::placeholder{color:#93aed0;opacity:.7}
</style>
</head>

<main>
  <div class="hero">
    <h1 data-i18n="title">Comprezzor</h1>
    <p data-i18n="subtitle">Compress images right in your browser — nothing uploaded.</p>
  </div>

  <div class="dropzone" id="dropzone">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
    <div data-i18n="dropTitle" style="font-size:14.5px;font-weight:600">Drag an image here or click to select</div>
    <div class="sub" data-i18n="dropSub">Supports JPG, PNG, WebP</div>
  </div>
  <input type="file" id="fileInput" accept="image/*">

  <div class="targetBox" id="batchBox" style="width:100%;max-width:640px;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:12px">
    <div style="font-size:14px;font-weight:600" data-i18n="batchTitle">Batch folder</div>
    <div class="row" style="display:flex;gap:8px;align-items:center">
      <input type="number" id="batchValue" min="0.1" step="0.1" value="2.5" style="flex:1">
      <select id="batchUnit" style="width:90px">
        <option value="1048576" selected>MB</option>
        <option value="1024">KB</option>
      </select>
    </div>
    <select id="batchFormat" style="width:100%">
      <option value="keep" selected data-i18n="batchFmtKeep">Output: original format</option>
      <option value="image/jpeg">Output: JPG</option>
      <option value="image/webp">Output: WebP</option>
    </select>
    <button class="btn" id="batchBtn" data-i18n="batchPick">Select folder &amp; compress all</button>
    <input type="file" id="batchInput" webkitdirectory directory multiple style="display:none">
    <div id="batchFileWrap" style="display:none;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px"><span id="batchFileName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">-</span><b id="batchFilePct">0%</b></div>
      <div style="height:6px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden"><div id="batchFileBar" style="height:100%;width:0;background:linear-gradient(90deg,#4fa3e3,#7fd1ff);transition:width .18s linear"></div></div>
    </div>
    <div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden"><div id="batchBar" style="height:100%;width:0;background:var(--accent-glow,#4fa3e3);transition:width .2s"></div></div>
    <div class="targetMsg" id="batchMsg"></div>
    <button class="btn secondary" id="batchReset" style="display:none" data-i18n="batchReset">Reset</button>
    <div id="batchLog" style="max-height:160px;overflow:auto;font-size:11.5px;color:var(--muted);font-family:monospace;white-space:pre-wrap"></div>
  </div>

  <div class="workspace" id="workspace">
    <div class="viewer">
      <div class="zoomBar">
        <button id="zoomOut">−</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn">+</button>
        <button id="zoomReset" data-i18n="reset">Reset</button>
        <button id="fullscreenBtn" data-i18n="fullscreen">⛶ Fullscreen</button>
        <span style="margin-left:auto;opacity:.7" data-i18n="dragHint">Drag the handle to compare · scroll to zoom</span>
      </div>
      <div class="canvasWrap" id="canvasWrap">
        <div class="stage" id="stage">
          <img id="origImg" draggable="false">
          <div class="clipLayer" id="clipLayer"><canvas id="compCanvas"></canvas></div>
          <div class="handle" id="handle"><div class="line"></div><div class="knob">⇔</div></div>
        </div>
      </div>
      <div class="tagRow">
        <span class="tag"><span data-i18n="original">Original</span><b id="origSize">-</b></span>
        <span class="tag"><span data-i18n="compressed">Compressed</span><b id="compSize">-</b></span>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl">
        <label data-i18n="format">Format</label>
        <select id="formatSelect">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG</option>
        </select>
      </div>
      <div class="ctrl" id="qualityCtrl">
        <label><span data-i18n="quality">Quality</span>: <span id="qualityVal">75</span>%</label>
        <input type="range" id="qualitySlider" min="1" max="100" value="75">
      </div>
      <div class="savings" id="savingsBox">—</div>
    </div>

    <div class="targetBox">
      <div class="ctrl">
        <label data-i18n="targetSize" style="font-size:12.5px;color:var(--muted)">Target size</label>
        <div class="row">
          <input type="number" id="targetValue" min="1" value="2" style="flex:1">
          <select id="targetUnit" style="width:90px">
            <option value="1048576" selected>MB</option>
            <option value="1024">KB</option>
          </select>
        </div>
      </div>
      <button class="btn" id="targetBtn" data-i18n="compressTo">Compress to target</button>
      <div class="targetMsg" id="targetMsg"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="resetBtn" data-i18n="another">Another image</button>
      <button class="btn" id="downloadBtn" data-i18n="download">Download</button>
    </div>
  </div>
</main>
<footer>Rinaldisign · Comprezzor Image Compressor</footer>

<script>
const i18n = {
  id:{title:"Comprezzor",subtitle:"Kompres gambar langsung di browser tanpa upload ke server.",
    dropTitle:"Seret gambar ke sini atau klik untuk pilih",dropSub:"Mendukung JPG, PNG, WebP",
    original:"Asli",compressed:"Hasil",format:"Format",quality:"Kualitas",
    download:"Unduh",another:"Gambar lain",saved:"lebih kecil",reset:"Reset",
    dragHint:"Geser gagang untuk bandingkan · scroll untuk zoom",
    targetSize:"Ukuran target",compressTo:"Kompres ke target",
    targetDone:"Tercapai pada kualitas", targetClose:"Terdekat pada kualitas",
    targetPngErr:"Ukuran target tidak berlaku untuk PNG (tidak ada kontrol kualitas).",fullscreen:"⛶ Layar penuh",batchTitle:"Proses folder (ukuran rata-rata per foto)",batchPick:"Pilih folder & kompres semua",batchDone:"Selesai",batchNoImg:"Tidak ada gambar di folder.",batchFmtKeep:"Output: format asli",batchReset:"Reset"},
  en:{title:"Comprezzor",subtitle:"Compress images right in your browser — nothing uploaded.",
    dropTitle:"Drag an image here or click to select",dropSub:"Supports JPG, PNG, WebP",
    original:"Original",compressed:"Compressed",format:"Format",quality:"Quality",
    download:"Download",another:"Another image",saved:"smaller",reset:"Reset",
    dragHint:"Drag the handle to compare · scroll to zoom",
    targetSize:"Target size",compressTo:"Compress to target",
    targetDone:"Reached at quality", targetClose:"Closest at quality",
    targetPngErr:"Target size doesn't apply to PNG (no quality control).",fullscreen:"⛶ Fullscreen",batchTitle:"Batch folder (target size per photo)",batchPick:"Select folder & compress all",batchDone:"Done",batchNoImg:"No images in folder.",batchFmtKeep:"Output: original format",batchReset:"Reset"},
  ja:{title:"Comprezzor",subtitle:"ブラウザ上で画像を圧縮。サーバーへのアップロードなし。",
    dropTitle:"画像をここにドラッグ、またはクリックして選択",dropSub:"JPG、PNG、WebP に対応",
    original:"元の画像",compressed:"圧縮後",format:"形式",quality:"品質",
    download:"ダウンロード",another:"別の画像",saved:"削減",reset:"リセット",
    dragHint:"ハンドルをドラッグして比較 · スクロールでズーム",
    targetSize:"目標サイズ",compressTo:"目標に圧縮",
    targetDone:"到達した品質", targetClose:"最も近い品質",
    targetPngErr:"PNGには目標サイズは適用できません（品質設定なし）。",fullscreen:"⛶ フルスクリーン",batchTitle:"フォルダ一括処理（1枚あたりの目標サイズ）",batchPick:"フォルダを選択して全て圧縮",batchDone:"完了",batchNoImg:"フォルダに画像がありません。",batchFmtKeep:"出力: 元の形式",batchReset:"リセット"}
};
let lang = "en";
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(i18n[lang][k]) el.textContent = i18n[lang][k];
  });
  computeSavings();
}
document.getElementById("langSelect").addEventListener("change",e=>{lang=e.target.value; applyI18n();});

const dropzone=document.getElementById("dropzone"), fileInput=document.getElementById("fileInput");
const workspace=document.getElementById("workspace"), origImg=document.getElementById("origImg");
const compCanvas=document.getElementById("compCanvas"), ctx=compCanvas.getContext("2d");
const formatSelect=document.getElementById("formatSelect"), qualitySlider=document.getElementById("qualitySlider");
const qualityVal=document.getElementById("qualityVal"), qualityCtrl=document.getElementById("qualityCtrl");
const origSizeEl=document.getElementById("origSize"), compSizeEl=document.getElementById("compSize");
const savingsBox=document.getElementById("savingsBox");
const canvasWrap=document.getElementById("canvasWrap"), stage=document.getElementById("stage");
const clipLayer=document.getElementById("clipLayer"), handle=document.getElementById("handle");
const zoomLevelEl=document.getElementById("zoomLevel");
const targetValue=document.getElementById("targetValue"), targetUnit=document.getElementById("targetUnit");
const targetBtn=document.getElementById("targetBtn"), targetMsg=document.getElementById("targetMsg");
const srcCanvas=document.createElement("canvas"); let renderTok=0;
let origBytes=0, compBytes=0, imgEl=null, lastBlobUrl=null;
let zoom=1, panX=0, panY=0, comparePct=50;

dropzone.addEventListener("click",()=>fileInput.click());
["dragenter","dragover"].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove("drag");}));
dropzone.addEventListener("drop",e=>{const f=e.dataTransfer.files[0]; if(f) handleFile(f);});
fileInput.addEventListener("change",e=>{const f=e.target.files[0]; if(f) handleFile(f);});

function fmtSize(b){ if(b<1024) return b+" B"; if(b<1024*1024) return (b/1024).toFixed(1)+" KB"; return (b/1024/1024).toFixed(2)+" MB"; }

function handleFile(file){
  origBytes=file.size;
  const reader=new FileReader();
  reader.onload=e=>{
    imgEl=new Image();
    imgEl.onload=()=>{
      origImg.src=e.target.result;
      origSizeEl.textContent=fmtSize(origBytes);
      compCanvas.width=imgEl.naturalWidth; compCanvas.height=imgEl.naturalHeight;
      srcCanvas.width=imgEl.naturalWidth; srcCanvas.height=imgEl.naturalHeight; srcCanvas.getContext("2d").drawImage(imgEl,0,0);
      dropzone.style.display="none"; workspace.style.display="flex";
      zoom=1; panX=0; panY=0; comparePct=50; targetMsg.textContent="";
      applyTransform(); updateClip();
      renderCompressed();
    };
    imgEl.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function encode(format,quality){
  return new Promise(res=>{
    srcCanvas.toBlob(blob=>res(blob), format, format==="image/png" ? undefined : quality);
  });
}

async function showBlob(blob){
  const bmp=await createImageBitmap(blob);
  ctx.clearRect(0,0,compCanvas.width,compCanvas.height);
  ctx.drawImage(bmp,0,0,compCanvas.width,compCanvas.height);
  bmp.close&&bmp.close();
}
async function renderCompressed(){
  if(!imgEl) return;
  const tok=++renderTok;
  const format=formatSelect.value;
  const quality=Number(qualitySlider.value)/100;
  qualityCtrl.style.opacity = format==="image/png" ? .4 : 1;
  const blob=await encode(format,quality);
  if(!blob||tok!==renderTok) return;
  await showBlob(blob);
  if(tok!==renderTok) return;
  compBytes=blob.size;
  compSizeEl.textContent=fmtSize(compBytes);
  if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
  lastBlobUrl=URL.createObjectURL(blob);
  computeSavings();
}

function computeSavings(){
  if(!compBytes||!origBytes){ savingsBox.textContent="—"; return; }
  const diff = origBytes-compBytes;
  const pct = ((diff/origBytes)*100).toFixed(0);
  const arrow = diff>=0 ? "↓" : "↑";
  savingsBox.innerHTML = `${arrow} <b>${Math.abs(pct)}%</b> ${i18n[lang].saved}`;
}

// ---- compare slider ----
function updateClip(){
  clipLayer.style.width = (100 - comparePct) + "%";
  handle.style.left = comparePct + "%";
}
function pctFromClientX(clientX){
  const r = stage.getBoundingClientRect();
  return Math.min(100, Math.max(0, ((clientX - r.left) / r.width) * 100));
}
let draggingHandle=false;
handle.addEventListener("pointerdown",e=>{draggingHandle=true; e.stopPropagation(); handle.setPointerCapture(e.pointerId);});
handle.addEventListener("pointermove",e=>{ if(draggingHandle){ comparePct=pctFromClientX(e.clientX); updateClip(); }});
handle.addEventListener("pointerup",()=>draggingHandle=false);
stage.addEventListener("click",e=>{ if(!panning){ comparePct=pctFromClientX(e.clientX); updateClip(); }});

// ---- zoom & pan ----
function applyTransform(){
  stage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  zoomLevelEl.textContent = Math.round(zoom*100)+"%";
}
document.getElementById("zoomIn").addEventListener("click",()=>{zoom=Math.min(5,zoom+0.25); applyTransform();});
document.getElementById("zoomOut").addEventListener("click",()=>{zoom=Math.max(1,zoom-0.25); applyTransform();});
document.getElementById("zoomReset").addEventListener("click",()=>{zoom=1;panX=0;panY=0;applyTransform();});
document.getElementById("fullscreenBtn").addEventListener("click",()=>{
  if(!document.fullscreenElement) canvasWrap.requestFullscreen();
  else document.exitFullscreen();
});
canvasWrap.addEventListener("wheel",e=>{
  e.preventDefault();
  zoom=Math.min(5,Math.max(1,zoom + (e.deltaY<0?0.15:-0.15)));
  applyTransform();
},{passive:false});
let panning=false, panStart=null;
canvasWrap.addEventListener("pointerdown",e=>{
  if(e.target===handle||e.target.closest("#handle")) return;
  panning=true; panStart={x:e.clientX-panX,y:e.clientY-panY};
  canvasWrap.classList.add("panning"); canvasWrap.setPointerCapture(e.pointerId);
});
canvasWrap.addEventListener("pointermove",e=>{
  if(panning){ panX=e.clientX-panStart.x; panY=e.clientY-panStart.y; applyTransform(); }
});
["pointerup","pointerleave"].forEach(ev=>canvasWrap.addEventListener(ev,()=>{panning=false; canvasWrap.classList.remove("panning");}));

// ---- target size (binary search on quality) ----
async function compressToTarget(){
  const format=formatSelect.value;
  if(format==="image/png"){ targetMsg.textContent=i18n[lang].targetPngErr; return; }
  const targetBytes = Number(targetValue.value) * Number(targetUnit.value);
  if(!targetBytes || !imgEl) return;
  targetBtn.disabled=true; renderTok++;
  let lo=0.01, hi=1, bestQ=1, bestBlob=null, bestDiff=Infinity;
  for(let i=0;i<8;i++){
    const mid=(lo+hi)/2;
    const blob=await encode(format,mid);
    const diff=Math.abs(blob.size-targetBytes);
    if(diff<bestDiff){ bestDiff=diff; bestQ=mid; bestBlob=blob; }
    if(blob.size>targetBytes) hi=mid; else lo=mid;
  }
  await showBlob(bestBlob);
  compBytes=bestBlob.size;
  compSizeEl.textContent=fmtSize(compBytes);
  if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
  lastBlobUrl=URL.createObjectURL(bestBlob);
  qualitySlider.value=Math.round(bestQ*100); qualityVal.textContent=qualitySlider.value;
  computeSavings();
  const label = bestBlob.size<=targetBytes*1.02 ? i18n[lang].targetDone : i18n[lang].targetClose;
  targetMsg.textContent = `${label} ${Math.round(bestQ*100)}% — ${fmtSize(bestBlob.size)}`;
  targetBtn.disabled=false;
}
targetBtn.addEventListener("click",compressToTarget);

formatSelect.addEventListener("change",renderCompressed);
qualitySlider.addEventListener("input",()=>{qualityVal.textContent=qualitySlider.value; renderCompressed();});
document.getElementById("downloadBtn").addEventListener("click",()=>{
  if(!lastBlobUrl) return;
  const ext = formatSelect.value.split("/")[1];
  const a=document.createElement("a");
  a.href=lastBlobUrl; a.download="comprezzor-"+Date.now()+"."+ext; a.click();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  workspace.style.display="none"; dropzone.style.display="block";
  fileInput.value=""; origBytes=0; compBytes=0; imgEl=null;
});

// ---- batch folder -> zip ----
const batchInput=document.getElementById("batchInput"), batchBtn=document.getElementById("batchBtn");
const batchFileWrap=document.getElementById("batchFileWrap"), batchFileName=document.getElementById("batchFileName"), batchFilePct=document.getElementById("batchFilePct"), batchFileBar=document.getElementById("batchFileBar"), batchReset=document.getElementById("batchReset");
const batchBar=document.getElementById("batchBar"), batchMsg=document.getElementById("batchMsg"), batchLog=document.getElementById("batchLog");
batchBtn.addEventListener("click",()=>batchInput.click());
function setFileProg(p){ const v=Math.round(p*100); batchFileBar.style.width=v+"%"; batchFilePct.textContent=v+"%"; }
batchReset.addEventListener("click",()=>{
  batchLog.textContent=""; batchMsg.textContent=""; batchBar.style.width="0"; setFileProg(0);
  batchFileWrap.style.display="none"; batchReset.style.display="none"; batchBtn.disabled=false;
});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
batchInput.addEventListener("change",e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length) runBatch(fs); });

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function buildZip(entries){ // entries:[{name,data:Uint8Array}] store-only
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  const d=new Date(), dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate()), tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1));
  for(const f of entries){
    const nb=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);
    lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nb,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);
    ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nb);
    off+=30+nb.length+sz;
  }
  let cdSize=0; for(const b of cd) cdSize+=b.byteLength;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:"application/zip"});
}

function canvasBlob(c,type,q){return new Promise(r=>c.toBlob(r,type,q));}
function drawScaled(bmp,scale){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(bmp.width*scale)); c.height=Math.max(1,Math.round(bmp.height*scale));
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality="high"; x.drawImage(bmp,0,0,c.width,c.height); return c;
}
// cari kualitas tertinggi yang masih <= target; jika kualitas min masih terlalu besar, kecilkan dimensi
async function fitToTarget(bmp,type,target,cb){
  cb=cb||(()=>{}); const MINQ=0.5, ITERS=type==="image/webp"?5:7, TOTAL=2+ITERS; let scale=1,k=0;
  const tick=()=>cb(Math.min(0.97,0.1+0.87*(++k)/TOTAL));
  const enc=async(c,q)=>{const b=await canvasBlob(c,type,q); tick(); return b;};
  for(let round=0;round<8;round++){
    const c=drawScaled(bmp,scale);
    let lo=MINQ, hi=0.95, best=null;
    const top=await enc(c,hi);
    if(top&&top.size<=target) return top;
    const bot=await enc(c,lo);
    if(bot&&bot.size<=target){
      best=bot;
      for(let i=0;i<ITERS;i++){
        const mid=(lo+hi)/2, b=await enc(c,mid);
        if(b.size<=target){best=b;lo=mid;} else hi=mid;
      }
      return best;
    }
    scale*=Math.max(0.5,Math.min(0.95,Math.sqrt(target/bot.size)*0.97));
    k=Math.min(k,TOTAL-2);
  }
  return canvasBlob(drawScaled(bmp,scale),type,MINQ);
}

async function runBatch(files){
  const T=i18n[lang];
  const imgs=files.filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));
  if(!imgs.length){batchMsg.textContent=T.batchNoImg;return;}
  const target=Number(document.getElementById("batchValue").value)*Number(document.getElementById("batchUnit").value);
  batchBtn.disabled=true; batchReset.style.display="none"; batchLog.textContent=""; batchBar.style.width="0"; batchFileWrap.style.display="flex"; setFileProg(0);
  const entries=[], used=new Set(); let inB=0,outB=0;
  const root=(imgs[0].webkitRelativePath||"").split("/")[0]||"compressed";
  for(let i=0;i<imgs.length;i++){
    const f=imgs[i]; let rel=f.webkitRelativePath||f.name;
    rel=rel.split("/").slice(1).join("/")||f.name;
    let out=f, line="";
    batchFileName.textContent=`(${i+1}/${imgs.length}) ${rel}`; batchFileBar.style.transition="none"; setFileProg(0); await sleep(30); batchFileBar.style.transition="";
    const prog=p=>{ setFileProg(p); batchBar.style.width=((i+p)/imgs.length*100)+"%"; };
    try{
      const isWebp=/webp/i.test(f.type)||/\.webp$/i.test(f.name);
      const fmt=document.getElementById("batchFormat").value;
      const type=fmt==="keep"?(isWebp?"image/webp":"image/jpeg"):fmt;
      const sameType=(type==="image/webp")===isWebp && (type==="image/webp"||/jpe?g/i.test(f.type+f.name));
      const forced=fmt!=="keep" && !sameType;
      if(f.size>target||forced){
        prog(0.05); const bmp=await createImageBitmap(f);
        const b=await fitToTarget(bmp,type,target,prog); bmp.close&&bmp.close();
        if(b&&(forced||b.size<f.size)){ out=b; rel=rel.replace(/\.[^.]+$/,"")+(type==="image/webp"?".webp":".jpg"); }
      }
      line=`${rel}  ${fmtSize(f.size)} → ${fmtSize(out.size)}`;
    }catch(err){ line=`${rel}  ✗ ${err.message||err}`; }
    let name=rel,n=1; while(used.has(name.toLowerCase())){name=rel.replace(/(\.[^.]+)?$/,`_${n++}$1`);}
    used.add(name.toLowerCase());
    entries.push({name,data:new Uint8Array(await out.arrayBuffer())});
    inB+=f.size; outB+=out.size;
    prog(1); await sleep(160);
    batchLog.textContent+=line+"\n"; batchLog.scrollTop=batchLog.scrollHeight;
    batchBar.style.width=((i+1)/imgs.length*100)+"%";
    batchMsg.textContent=`${i+1}/${imgs.length}`;
  }
  const zip=buildZip(entries), a=document.createElement("a");
  a.href=URL.createObjectURL(zip); a.download=root+"-compressed.zip"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  batchMsg.textContent=`${T.batchDone}: ${imgs.length} · ${fmtSize(inB)} → ${fmtSize(outB)}`;
  batchBtn.disabled=false; batchReset.style.display="block";
}

applyI18n();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
